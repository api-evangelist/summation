aid: summation
name: Summation
description: >-
  Summation is an enterprise AI analyst platform that automates recurring
  business work — financial reviews, forecasts, models, and executive-ready
  decks — by connecting to a company's data sources (ERPs, data warehouses,
  and spreadsheets) and producing verified, source-traced reports in the
  format teams already use. Its AI agent "Addison" runs playbooks across
  finance, operations, and sales, tracing every number back to its source so
  outputs are audit-ready and SOC 2 Type II compliant. Founded by Ian Wong
  (CEO) and Ramachandran "RC" Ramarathinam (CTO), formerly of Opendoor,
  Summation is backed by Battery Ventures. The company operates a customer
  application, product documentation, and a public Trust Center, but does not
  currently publish a public developer API surface.
